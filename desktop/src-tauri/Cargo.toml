[package]
name = "notairedz-desktop"
version = "1.0.1"
edition = "2021"
description = "NotaireDZ desktop shell (Tauri 2)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notaire-core = { path = "../../core" }
hex = "0.4"
