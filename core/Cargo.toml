[package]
name = "notaire-core"
version = "1.0.1"
edition = "2021"
description = "Domain core for NotaireDZ: crypto envelope, audit chain, RBAC, rules engine, storage, backup"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
thiserror = "1"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
tempfile = "3"
